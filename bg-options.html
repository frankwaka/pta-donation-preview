<style>

    --sun:#F0C84A; --sun-d:#9A7212; --sun-l:#FBEBC0; --red:#D6453A; --red-d:#C23B30; --red-l:#F8DDD8;
    --wobble:22px 30px 24px 34px / 30px 22px 34px 24px;

  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:"Noto Sans TC", system-ui, sans-serif; color:var(--ink); line-height:1.6;
    background-color:var(--cream);

  }
  .wrap { max-width:1320px; margin:0 auto; padding:36px 22px 64px; }
  header { text-align:center; max-width:760px; margin:0 auto 26px; }
  h1 { font-weight:900; font-size:clamp(24px,3.4vw,34px); letter-spacing:.04em; margin:0 0 10px; }
  .lead { color:var(--ink-2); margin:0; }
  .lead strong { color:var(--ink); }
  .note { display:inline-block; margin-top:12px; padding:4px 14px; border:2px dashed var(--line);
          border-radius:999px; color:var(--ink-3); font-size:14px; background:var(--paper); }

  .art { position:relative; aspect-ratio:1/1; overflow:hidden; background:var(--sky);
         border:3px solid var(--ink); border-radius:var(--wobble);
         box-shadow:0 6px 0 rgba(59,42,32,.08), 0 14px 26px rgba(59,42,32,.08); }
  .art svg { display:block; width:100%; height:100%; }

  /* 基準圖 */
  .base { display:flex; flex-direction:column; align-items:center; margin:0 auto 42px; }
  .base .frame { position:relative; width:min(360px,86vw); }
  .base .tag { position:absolute; top:-14px; right:-12px; z-index:2; background:var(--red); color:var(--paper);
               font-weight:900; font-size:14px; padding:4px 12px; border:3px solid var(--ink);
               border-radius:12px 16px 12px 18px; transform:rotate(4deg); }
  .base .code { margin:14px 0 2px; font-weight:900; }
  .base .cap { margin:0; color:var(--ink-2); text-align:center; }
  /* 選項頁只放靜態微笑：隱藏 01 的大笑臉圖層（不改 SVG 內容） */
  .base .face-l { display:none; }

  /* 兩個分區 */
  .cols { display:grid; grid-template-columns:1fr; gap:36px; }
  @media (min-width:1100px) { .cols { grid-template-columns:1fr 1fr; gap:30px; } }
  section.panel { background:var(--paper); border:3px solid var(--ink); border-radius:var(--wobble); padding:20px 20px 24px; }
  section.panel h2 { margin:0 0 4px; font-size:22px; font-weight:900; display:flex; align-items:center; gap:10px; }
  section.panel h2::before { content:""; width:14px; height:14px; border:2.5px solid var(--ink); border-radius:50%; background:var(--c); }
  section.panel .sub { margin:0 0 16px; color:var(--ink-3); font-size:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } }
  .card { margin:0; }
  .card .head { margin:0 0 8px; }
  .badge { display:inline-block; font-weight:900; font-size:14px; padding:2px 12px; border:2.5px solid var(--ink);
           border-radius:10px 14px 10px 16px; background:var(--paper); }
  .badge.sea { background:var(--sea-l); }
  .badge.sky { background:var(--sky-l); }
  .card.is-cur .badge { background:var(--line); color:var(--ink-2); }
  .card .cap { margin:10px 2px 0; font-size:14.5px; color:var(--ink-2); }
  footer { margin-top:38px; text-align:center; color:var(--ink-3); font-size:13px; }
</style>
</head>
